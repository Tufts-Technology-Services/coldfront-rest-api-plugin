[project]
name = "coldfront-rest-api-plugin"
version = "0.1.0"
description = "Plugin for ColdFront that serves a read-only REST API of projects, allocations and storage quotas."
authors = [
    { name = "Chris Barnett" },
    # parts are copied or adapted from ColdFront's API plugin; see the README's Credits
    { name = "ColdFront Authors" },
]
readme = "README.md"
# 3.11: django-filter 26 needs it
requires-python = ">=3.11"
# AGPL, as ColdFront is: parts are copied or adapted from ColdFront's own code
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["high-performance-computing", "resource-allocation", "rest-api"]
classifiers = [
    'Programming Language :: Python :: 3',
    'Framework :: Django :: 5.2',
    'Topic :: Scientific/Engineering',
    'Topic :: System :: Systems Administration',
    'Topic :: Internet :: WWW/HTTP :: WSGI :: Application',
]
dependencies = [
    "coldfront>=1.1.8,<2",
    # ColdFront installs both, but only installs their apps with PLUGIN_API, which this plugin replaces
    "djangorestframework>=3.16.0",
    "django-filter>=25.1",
    # api_extensions: plugins register what they serve here, so the API never imports them.
    # On main until coldfront-utils 0.4.0 is tagged; then the tag.
    "coldfront-utils@git+https://github.com/Tufts-Technology-Services/coldfront-utils.git@main",
]

[project.urls]
"Source Code" = "https://github.com/Tufts-Technology-Services/coldfront-rest-api-plugin"

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "faker>=37.1.0",
    "pre-commit>=4.6.2",
    "pytest-django>=4.11.1",
    "ruff>=0.11.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rest_api"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "rest_api.tests.settings"
testpaths = ["rest_api/tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"  # the oldest Python in requires-python

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "S308", "S113"]

[tool.ruff.lint.isort]
# coldfront's imports get a section of their own, between third-party and this package's
sections = { "coldfront-main" = ["coldfront"] }
section-order = ["future", "standard-library", "third-party", "coldfront-main", "first-party", "local-folder"]

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true
